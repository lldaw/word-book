let currentFilter='all',currentView='list',currentSort='freq',searchQuery='';
let favorites=JSON.parse(localStorage.getItem('wordFavs')||'[]');
let mastered=JSON.parse(localStorage.getItem('wordMastered')||'[]');
let studyIndex=0,studyList=[];
function speakWord(text,btn){
  if(!('speechSynthesis' in window)){alert('您的浏览器不支持语音合成功能，请使用Chrome、Edge或Safari浏览器');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.85;u.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const ev=voices.find(v=>v.lang.startsWith('en')&&(v.name.includes('Google')||v.name.includes('Microsoft')||v.name.includes('Samantha')));
  if(ev)u.voice=ev;
  if(btn){btn.classList.add('playing');u.onend=()=>btn.classList.remove('playing');u.onerror=()=>btn.classList.remove('playing');}
  window.speechSynthesis.speak(u);
}
if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}
function getFreqLevel(f){if(f>=20)return'high';if(f>=10)return'mid';return'low';}
function getFilteredWords(){
  let list=[...words];
  if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(searchQuery)||w.pos.includes(searchQuery));}
  if(currentFilter==='high')list=list.filter(w=>w.freq>=20);
  else if(currentFilter==='mid')list=list.filter(w=>w.freq>=10&&w.freq<20);
  else if(currentFilter==='low')list=list.filter(w=>w.freq<10);
  else if(currentFilter==='fav')list=list.filter(w=>favorites.includes(w.id));
  else if(currentFilter==='unmastered')list=list.filter(w=>!mastered.includes(w.id));
  if(currentSort==='freq')list.sort((a,b)=>b.freq-a.freq||a.id-b.id);
  else if(currentSort==='alpha')list.sort((a,b)=>a.word.localeCompare(b.word));
  return list;
}
function renderWords(){
  const list=getFilteredWords();
  const c=document.getElementById('wordList');
  c.className='word-list '+(currentView==='card'?'card-view':'');
  if(list.length===0){c.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>没有找到匹配的单词</p></div>';}
  else{c.innerHTML=list.map(w=>{
    const isFav=favorites.includes(w.id),isMastered=mastered.includes(w.id),level=getFreqLevel(w.freq);
    return `<div class="word-card ${level}-freq ${isMastered?'mastered':''}" data-id="${w.id}">
      <div class="word-num">${w.id}</div><div class="word-freq">${w.freq}次</div>
      <div class="word-main" onclick="speakWord('${w.word.replace(/'/g,"\\'")}',this.closest('.word-card').querySelector('.speak-btn'))">
        <div class="word-text">${w.word}</div><div class="word-meaning">${w.pos} ${w.meaning}</div></div>
      <div class="word-actions">
        <button class="action-btn speak-btn" onclick="speakWord('${w.word.replace(/'/g,"\\'")}',this)" title="发音">🔊</button>
        <button class="action-btn fav-btn ${isFav?'active':''}" onclick="toggleFav(${w.id})" title="收藏">${isFav?'⭐':'☆'}</button>
        <button class="action-btn master-btn ${isMastered?'active':''}" onclick="toggleMaster(${w.id})" title="已掌握">${isMastered?'✅':'⬜'}</button>
      </div></div>`;
  }).join('');}
  document.getElementById('totalCount').textContent=words.length;
  document.getElementById('favCount').textContent=favorites.length;
  document.getElementById('masteredCount').textContent=mastered.length;
  document.getElementById('shownCount').textContent=list.length;
}
function toggleFav(id){const i=favorites.indexOf(id);if(i>-1)favorites.splice(i,1);else favorites.push(id);localStorage.setItem('wordFavs',JSON.stringify(favorites));renderWords();}
function toggleMaster(id){const i=mastered.indexOf(id);if(i>-1)mastered.splice(i,1);else mastered.push(id);localStorage.setItem('wordMastered',JSON.stringify(mastered));renderWords();}
document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value.trim();renderWords();});
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;renderWords();});});
document.querySelectorAll('.view-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;renderWords();});});
document.getElementById('sortFreq').addEventListener('click',()=>{currentSort='freq';document.getElementById('sortFreq').style.borderColor='#e74c3c';document.getElementById('sortFreq').style.color='#e74c3c';document.getElementById('sortAlpha').style.borderColor='#e0e6ed';document.getElementById('sortAlpha').style.color='#5a6c7d';renderWords();});
document.getElementById('sortAlpha').addEventListener('click',()=>{currentSort='alpha';document.getElementById('sortAlpha').style.borderColor='#e74c3c';document.getElementById('sortAlpha').style.color='#e74c3c';document.getElementById('sortFreq').style.borderColor='#e0e6ed';document.getElementById('sortFreq').style.color='#5a6c7d';renderWords();});
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('确定要重置所有学习进度吗？')){favorites=[];mastered=[];localStorage.removeItem('wordFavs');localStorage.removeItem('wordMastered');renderWords();}});
function startStudy(){studyList=getFilteredWords();if(studyList.length===0){alert('当前筛选条件下没有单词可供学习');return;}studyIndex=0;document.getElementById('studyOverlay').classList.add('show');showStudyWord();}
function showStudyWord(){const w=studyList[studyIndex];document.getElementById('studyWord').textContent=w.word;document.getElementById('studyPhonetic').textContent=w.pos;document.getElementById('studyMeaning').textContent=w.meaning;document.getElementById('studyMeaning').classList.remove('show');document.getElementById('studyProgress').textContent=`${studyIndex+1} / ${studyList.length}`;speakWord(w.word);}
function toggleMeaning(){document.getElementById('studyMeaning').classList.toggle('show');}
function studySpeak(){speakWord(document.getElementById('studyWord').textContent);}
function studyNext(){if(studyIndex<studyList.length-1){studyIndex++;showStudyWord();}else{alert('🎉 恭喜！你已经学完了当前列表的所有单词！');}}
function studyPrev(){if(studyIndex>0){studyIndex--;showStudyWord();}}
function studyMaster(){const w=studyList[studyIndex];if(!mastered.includes(w.id)){mastered.push(w.id);localStorage.setItem('wordMastered',JSON.stringify(mastered));}studyNext();}
function closeStudy(){document.getElementById('studyOverlay').classList.remove('show');window.speechSynthesis.cancel();renderWords();}
document.getElementById('studyModeBtn').addEventListener('click',startStudy);
document.addEventListener('keydown',e=>{if(document.getElementById('studyOverlay').classList.contains('show')){if(e.key==='ArrowRight')studyNext();else if(e.key==='ArrowLeft')studyPrev();else if(e.key===' '){e.preventDefault();studySpeak();}else if(e.key==='Escape')closeStudy();else if(e.key==='Enter')toggleMeaning();}});
renderWords();
</script>
