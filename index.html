<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专升本高频500词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#2c3e50;min-height:100vh;padding-bottom:70px;overflow-x:hidden;}
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.top-bar{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f3f7;position:sticky;top:0;z-index:100;}
.top-bar h1{font-size:18px;font-weight:700;}
.top-bar .icon-btn{width:36px;height:36px;border:none;background:#f5f7fa;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:pointer;color:#95a5a6;transition:color .2s;}
.tab-item .icon{font-size:22px;}
.tab-item .label{font-size:11px;margin-top:2px;font-weight:500;}
.tab-item.active{color:#f5a623;}
.container{max-width:480px;margin:0 auto;padding:14px 16px;}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.card-title{font-size:17px;font-weight:700;margin-bottom:14px;color:#2c3e50;}
.book-card{display:flex;flex-direction:column;gap:10px;}
.book-header{display:flex;justify-content:space-between;align-items:center;}
.book-name{font-size:18px;font-weight:700;}
.book-progress-text{font-size:13px;color:#7f8c8d;}
.progress-bar{height:8px;background:#f0f3f7;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#f5a623,#f7c948);border-radius:4px;transition:width .5s;}
.today-plan{display:flex;gap:0;}
.plan-col{flex:1;text-align:center;padding:10px 0;}
.plan-col:first-child{border-right:1px solid #f0f3f7;}
.plan-num{font-size:32px;font-weight:800;color:#2c3e50;}
.plan-num .total{font-size:18px;color:#bdc3c7;font-weight:500;}
.plan-label{font-size:13px;color:#7f8c8d;margin-top:2px;}
.plan-btns{display:flex;gap:12px;margin-top:16px;}
.plan-btn{flex:1;padding:16px 0;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;transition:all .15s;background:linear-gradient(135deg,#ffd54f,#f5a623);color:#fff;box-shadow:0 4px 12px rgba(245,166,35,.3);}
.plan-btn:active{transform:scale(.97);box-shadow:0 2px 6px rgba(245,166,35,.3);}
.plan-btn.done{background:#e8f8f0;color:#27ae60;box-shadow:none;}
.free-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.free-item{display:flex;align-items:center;gap:10px;padding:14px;background:#f8f9fb;border-radius:12px;cursor:pointer;transition:background .15s;}
.free-item:active{background:#eef1f5;}
.free-icon{font-size:24px;font-weight:800;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0;}
.free-icon.listen{background:#e8f0fe;color:#4a90d9;}
.free-icon.speak{background:#f3e8fe;color:#9b59b6;}
.free-icon.read{background:#fef3e8;color:#e67e22;}
.free-icon.write{background:#e8f8f0;color:#27ae60;}
.free-text{font-size:14px;font-weight:600;color:#2c3e50;}
.free-sub{font-size:11px;color:#95a5a6;margin-top:1px;}
.free-icons-row{display:flex;justify-content:space-around;margin-top:16px;padding-top:14px;border-top:1px solid #f0f3f7;}
.free-icon-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.free-icon-item .fi{font-size:26px;}
.free-icon-item .fl{font-size:11px;color:#7f8c8d;}
.study-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:#7f8c8d;}
.study-header .bar{flex:1;height:6px;background:#e0e6ed;border-radius:3px;margin:0 12px;overflow:hidden;}
.study-header .bar-fill{height:100%;background:linear-gradient(90deg,#f5a623,#f7c948);border-radius:3px;transition:width .3s;}
.flashcard{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08);min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;cursor:pointer;position:relative;transition:transform .15s;}
.flashcard:active{transform:scale(.98);}
.fc-word{font-size:38px;font-weight:800;color:#2c3e50;letter-spacing:.5px;text-align:center;word-break:break-word;}
.fc-pos{font-size:15px;color:#95a5a6;margin-top:8px;font-style:italic;}
.fc-meaning{font-size:20px;color:#5a6c7d;margin-top:16px;text-align:center;line-height:1.6;display:none;}
.flashcard.flipped .fc-meaning{display:block;animation:fadeIn .25s;}
.fc-hint{position:absolute;bottom:16px;font-size:12px;color:#bdc3c7;}
.fc-speak{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:#fef3e8;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fc-tag{position:absolute;top:16px;left:16px;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;background:#fef3e8;color:#e67e22;}
.study-actions{display:flex;gap:10px;margin-top:18px;}
.study-btn{flex:1;padding:14px 0;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.study-btn:active{transform:scale(.96);}
.btn-unknown{background:#fef0ef;color:#e74c3c;}
.btn-vague{background:#fff8e1;color:#f39c12;}
.btn-known{background:#e8f8f0;color:#27ae60;}
.study-btn .bi{font-size:20px;}
.study-btn .bt{font-size:12px;}
.summary-card{background:#fff;border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08);}
.summary-card .emoji{font-size:56px;margin-bottom:12px;}
.summary-card h2{font-size:22px;margin-bottom:8px;}
.summary-card .score{font-size:42px;font-weight:800;color:#f5a623;margin:10px 0;}
.summary-card p{color:#7f8c8d;font-size:14px;margin-bottom:4px;}
.summary-actions{display:flex;gap:10px;margin-top:20px;}
.summary-actions button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#ffd54f,#f5a623);color:#fff;}
.btn-secondary{background:#f0f3f7;color:#5a6c7d;}
.spell-card{background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;}
.spell-meaning{font-size:22px;color:#2c3e50;font-weight:600;margin-bottom:6px;line-height:1.5;}
.spell-pos{font-size:14px;color:#95a5a6;margin-bottom:18px;font-style:italic;}
.spell-speak{width:52px;height:52px;border-radius:50%;background:#fef3e8;border:none;font-size:24px;cursor:pointer;margin-bottom:18px;display:inline-flex;align-items:center;justify-content:center;}
.spell-input{width:100%;padding:14px 18px;border:2px solid #e0e6ed;border-radius:14px;font-size:18px;text-align:center;letter-spacing:2px;outline:none;transition:border-color .2s;font-weight:600;color:#2c3e50;}
.spell-input:focus{border-color:#f5a623;}
.spell-input.correct{border-color:#27ae60;background:#f0faf4;color:#27ae60;}
.spell-input.wrong{border-color:#e74c3c;background:#fef5f5;color:#e74c3c;}
.spell-feedback{margin-top:14px;font-size:15px;font-weight:600;min-height:24px;}
.fb-correct{color:#27ae60;}
.fb-wrong{color:#e74c3c;}
.fb-wrong .ans{display:block;margin-top:4px;font-size:13px;color:#7f8c8d;}
.spell-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:all .15s;}
.spell-btn:active{transform:scale(.98);}
.quiz-card{background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
.quiz-question{font-size:28px;font-weight:800;color:#2c3e50;text-align:center;margin-bottom:6px;word-break:break-word;}
.quiz-pos{font-size:14px;color:#95a5a6;text-align:center;margin-bottom:20px;font-style:italic;}
.quiz-options{display:flex;flex-direction:column;gap:10px;}
.quiz-option{padding:14px 18px;border:2px solid #e0e6ed;border-radius:12px;cursor:pointer;transition:all .15s;font-size:15px;color:#5a6c7d;display:flex;align-items:center;gap:10px;}
.quiz-option .ol{width:26px;height:26px;border-radius:50%;background:#f0f3f7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.quiz-option.selected{border-color:#f5a623;background:#fef9f0;}
.quiz-option.selected .ol{background:#f5a623;color:#fff;}
.quiz-option.correct{border-color:#27ae60;background:#f0faf4;}
.quiz-option.correct .ol{background:#27ae60;color:#fff;}
.quiz-option.wrong{border-color:#e74c3c;background:#fef5f5;}
.quiz-option.wrong .ol{background:#e74c3c;color:#fff;}
.quiz-option.disabled{pointer-events:none;}
.quiz-nav{display:flex;gap:10px;margin-top:18px;}
.quiz-nav button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;}
.list-search{position:relative;margin-bottom:10px;}
.list-search input{width:100%;padding:12px 16px 12px 40px;border:2px solid #e0e6ed;border-radius:12px;font-size:14px;background:#fff;outline:none;}
.list-search input:focus{border-color:#f5a623;}
.list-search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;}
.list-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.list-filter{padding:6px 12px;border:1.5px solid #e0e6ed;background:#fff;border-radius:8px;font-size:12px;cursor:pointer;color:#5a6c7d;font-weight:500;}
.list-filter.active{background:#f5a623;color:#fff;border-color:#f5a623;}
.word-item{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.04);border-left:3px solid #e0e6ed;}
.word-item.high{border-left-color:#e74c3c;}
.word-item.mid{border-left-color:#f39c12;}
.word-item.low{border-left-color:#3498db;}
.word-item.learned{opacity:.55;}
.word-item.learned .wi-word{text-decoration:line-through;}
.wi-num{font-size:11px;color:#bdc3c7;font-weight:600;min-width:28px;text-align:center;}
.wi-main{flex:1;cursor:pointer;min-width:0;}
.wi-word{font-size:17px;font-weight:700;color:#2c3e50;}
.wi-meaning{font-size:12px;color:#7f8c8d;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wi-actions{display:flex;gap:4px;flex-shrink:0;}
.wi-btn{width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:#f5f7fa;}
.wi-btn.spk{background:#fef3e8;}
.wi-btn.fav.active{background:#fef0ef;}
.stats-hero{background:linear-gradient(135deg,#f5a623,#e67e22);border-radius:20px;padding:24px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(245,166,35,.3);}
.stats-hero .sn{font-size:48px;font-weight:800;line-height:1;}
.stats-hero .sl{font-size:13px;opacity:.9;margin-top:4px;}
.stats-hero .sf{font-size:28px;margin-bottom:4px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stats-card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.stats-card .si{font-size:24px;margin-bottom:6px;}
.stats-card .snum{font-size:24px;font-weight:800;color:#2c3e50;}
.stats-card .slbl{font-size:11px;color:#95a5a6;margin-top:2px;}
.stats-prog{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px;}
.stats-prog h3{font-size:15px;margin-bottom:14px;}
.prog-row{margin-bottom:12px;}
.prog-row:last-child{margin-bottom:0;}
.prog-row .prl{display:flex;justify-content:space-between;font-size:12px;color:#5a6c7d;margin-bottom:4px;}
.prog-row .prb{height:8px;background:#f0f3f7;border-radius:4px;overflow:hidden;}
.prog-row .prf{height:100%;border-radius:4px;transition:width .5s;}
.pf-mastered{background:#27ae60;}
.pf-learning{background:#f39c12;}
.pf-new{background:#bdc3c7;}
.settings-group{margin-bottom:20px;}
.settings-group h3{font-size:14px;color:#95a5a6;margin-bottom:10px;padding-left:4px;}
.num-picker{display:flex;gap:6px;flex-wrap:wrap;}
.num-opt{padding:8px 14px;border:1.5px solid #e0e6ed;border-radius:10px;font-size:14px;cursor:pointer;color:#5a6c7d;font-weight:500;background:#fff;}
.num-opt.active{background:#f5a623;color:#fff;border-color:#f5a623;}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;animation:fadeIn .2s;}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-header{padding:16px 20px;border-bottom:1px solid #f0f3f7;display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;}
.modal-close{width:30px;height:30px;border:none;background:#f5f7fa;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px;}
.modal-empty{text-align:center;padding:40px 20px;color:#bdc3c7;}
.modal-empty .icon{font-size:40px;margin-bottom:8px;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.me-section{margin-bottom:20px;}
.me-item{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid #f8f9fb;}
.me-item:first-child{border-radius:12px 12px 0 0;}
.me-item:last-child{border-radius:0 0 12px 12px;border-bottom:none;}
.me-item .mi-icon{font-size:20px;width:32px;text-align:center;}
.me-item .mi-text{flex:1;font-size:15px;color:#2c3e50;}
.me-item .mi-arrow{color:#bdc3c7;font-size:14px;}
.me-item .mi-badge{background:#e74c3c;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
@media(max-width:380px){.fc-word{font-size:32px;}.quiz-question{font-size:24px;}.plan-num{font-size:28px;}}
</style>
</head>
<body>
<div class="page active" id="page-home">
  <div class="top-bar"><h1>📚 专升本高频500词</h1><button class="icon-btn" onclick="openSettings()">⚙️</button></div>
  <div class="container">
    <div class="card book-card">
      <div class="book-header"><span class="book-name">专升本高频500词</span></div>
      <div class="book-progress-text" id="bookProgressText">已学 0/498 词</div>
      <div class="progress-bar"><div class="progress-fill" id="bookProgressFill" style="width:0%"></div></div>
    </div>
    <div class="card">
      <div class="card-title">今日计划</div>
      <div class="today-plan">
        <div class="plan-col"><div class="plan-num"><span id="todayNewDone">0</span><span class="total">/<span id="todayNewTotal">10</span></span></div><div class="plan-label">新学</div></div>
        <div class="plan-col"><div class="plan-num"><span id="todayReviewDone">0</span><span class="total">/<span id="todayReviewTotal">40</span></span></div><div class="plan-label">复习</div></div>
      </div>
      <div class="plan-btns"><button class="plan-btn" id="btnNew" onclick="startNewStudy()">新学</button><button class="plan-btn" id="btnReview" onclick="startReviewStudy()">复习</button></div>
    </div>
    <div class="card">
      <div class="card-title">自由练习</div>
      <div class="free-grid">
        <div class="free-item" onclick="startListen()"><div class="free-icon listen">听</div><div><div class="free-text">听力训练</div><div class="free-sub">听发音选单词</div></div></div>
        <div class="free-item" onclick="startRead()"><div class="free-icon read">读</div><div><div class="free-text">释义巩固</div><div class="free-sub">看单词选释义</div></div></div>
        <div class="free-item" onclick="startSpell()"><div class="free-icon write">写</div><div><div class="free-text">拼写练习</div><div class="free-sub">看释义拼单词</div></div></div>
        <div class="free-item" onclick="switchTab('list')"><div class="free-icon speak">说</div><div><div class="free-text">列表刷词</div><div class="free-sub">浏览全部单词</div></div></div>
      </div>
      <div class="free-icons-row">
        <div class="free-icon-item" onclick="openWrongModal()"><div class="fi">📝</div><div class="fl">错词本</div></div>
        <div class="free-icon-item" onclick="switchTab('list')"><div class="fi">📖</div><div class="fl">单词表</div></div>
        <div class="free-icon-item" onclick="showToast('随身听功能开发中')"><div class="fi">🎧</div><div class="fl">随身听</div></div>
        <div class="free-icon-item" onclick="openSettings()"><div class="fi">⚙️</div><div class="fl">设置</div></div>
      </div>
    </div>
  </div>
</div>
<div class="page" id="page-study">
  <div class="top-bar"><h1 id="studyTitle">新学</h1><button class="icon-btn" onclick="quitStudy()">✕</button></div>
  <div class="container" id="studyContent"></div>
</div>
<div class="page" id="page-spell">
  <div class="top-bar"><h1>✍️ 拼写练习</h1><button class="icon-btn" onclick="switchTab('home')">✕</button></div>
  <div class="container" id="spellContent"></div>
</div>
<div class="page" id="page-quiz">
  <div class="top-bar"><h1 id="quizTitle">释义巩固</h1><button class="icon-btn" onclick="switchTab('home')">✕</button></div>
  <div class="container" id="quizContent"></div>
</div>
<div class="page" id="page-list">
  <div class="top-bar"><h1>📖 单词表</h1><button class="icon-btn" onclick="switchTab('home')">✕</button></div>
  <div class="container" id="listContent"></div>
</div>
<div class="page" id="page-stats">
  <div class="top-bar"><h1>📊 学习统计</h1></div>
  <div class="container" id="statsContent"></div>
</div>
<div class="page" id="page-me">
  <div class="top-bar"><h1>👤 我的</h1></div>
  <div class="container">
    <div class="me-section">
      <div class="me-item" onclick="openWrongModal()"><span class="mi-icon">📝</span><span class="mi-text">错词本</span><span class="mi-badge" id="meWrongBadge" style="display:none;">0</span><span class="mi-arrow">›</span></div>
      <div class="me-item" onclick="switchTab('list');setTimeout(()=>setListFilter('fav'),100)"><span class="mi-icon">⭐</span><span class="mi-text">我的收藏</span><span class="mi-arrow">›</span></div>
    </div>
    <div class="me-section">
      <div class="me-item" onclick="openSettings()"><span class="mi-icon">⚙️</span><span class="mi-text">学习设置</span><span class="mi-arrow">›</span></div>
      <div class="me-item" onclick="resetAll()"><span class="mi-icon">🔄</span><span class="mi-text" style="color:#e74c3c;">重置学习进度</span><span class="mi-arrow">›</span></div>
    </div>
    <div class="me-section">
      <div class="me-item" onclick="showToast('专升本高频500词 v2.0')"><span class="mi-icon">ℹ️</span><span class="mi-text">关于</span><span class="mi-arrow">›</span></div>
    </div>
  </div>
</div>
<div class="tab-bar">
  <div class="tab-item active" data-page="home"><span class="icon">📚</span><span class="label">单词</span></div>
  <div class="tab-item" data-page="stats"><span class="icon">📊</span><span class="label">统计</span></div>
  <div class="tab-item" data-page="me"><span class="icon">👤</span><span class="label">我的</span></div>
</div>

function todayStr(){return new Date().toISOString().slice(0,10)}
function checkDailyReset(){const t=todayStr();if(state.lastDate!==t){if(state.lastDate){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);if(state.lastDate===y&&(state.todayNew>0||state.todayReview>0))stats.streak++;else if(state.lastDate!==y)stats.streak=0;}state.todayNew=0;state.todayReview=0;state.lastDate=t;save('wb2_state',state);save('wb2_stats',stats);}}

let audioPlayer=null;
function speak(text){if(audioPlayer){audioPlayer.pause();audioPlayer=null;}const word=encodeURIComponent(text.trim());const type=settings.accent==='uk'?'1':'2';const url='https://dict.youdao.com/dictvoice?audio='+word+'&type='+type;try{audioPlayer=new Audio(url);audioPlayer.play().catch(()=>fallbackSpeak(text));audioPlayer.onerror=()=>fallbackSpeak(text);}catch(e){fallbackSpeak(text);}}
function fallbackSpeak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=settings.accent==='uk'?'en-GB':'en-US';u.rate=0.85;window.speechSynthesis.speak(u);}

  if(tab){document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));tab.classList.add('active');}
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(p==='home')renderHome();
  if(p==='list')renderList();
  if(p==='stats')renderStats();
  if(p==='me')renderMe();
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getLearnedCount(){return Object.keys(progress).length;}
function getMasteredCount(){return Object.values(progress).filter(p=>p.level>=5).length;}
const REVIEW_INTERVALS=[0,1,2,4,7,15];
function updateProgress(id,known){const p=progress[id]||{level:0,nextReview:0,reviews:0,firstLearned:Date.now()};p.reviews++;if(known)p.level=Math.min(p.level+1,5);else{p.level=0;if(!wrongWords.includes(id)){wrongWords.push(id);save('wb2_wrong',wrongWords);}}p.nextReview=Date.now()+REVIEW_INTERVALS[p.level]*86400000;progress[id]=p;save('wb2_progress',progress);stats.totalReviews++;save('wb2_stats',stats);}
function renderHome(){const learned=getLearnedCount();const pct=Math.round(learned/words.length*100);document.getElementById('bookProgressText').textContent=`已学 ${learned}/${words.length} 词`;document.getElementById('bookProgressFill').style.width=pct+'%';document.getElementById('todayNewDone').textContent=state.todayNew;document.getElementById('todayNewTotal').textContent=settings.dailyNew;document.getElementById('todayReviewDone').textContent=state.todayReview;document.getElementById('todayReviewTotal').textContent=settings.dailyReview;const btnNew=document.getElementById('btnNew');const btnReview=document.getElementById('btnReview');if(state.todayNew>=settings.dailyNew){btnNew.classList.add('done');btnNew.textContent='✓ 已完成';}else{btnNew.classList.remove('done');btnNew.textContent='新学';}const dueCount=getDueReviewCount();if(state.todayReview>=settings.dailyReview||dueCount===0){btnReview.classList.add('done');btnReview.textContent=dueCount===0?'暂无复习':'✓ 已完成';}else{btnReview.classList.remove('done');btnReview.textContent='复习';}}
function getDueReviewCount(){const now=Date.now();return words.filter(w=>{const p=progress[w.id];return p&&p.level>0&&p.level<5&&p.nextReview<=now;}).length;}
let studyQueue=[],studyIndex=0,studyMode='new',studyCorrect=0,studyTotal=0;
function startNewStudy(){studyMode='new';document.getElementById('studyTitle').textContent='📖 新学';const unlearned=words.filter(w=>!progress[w.id]);if(unlearned.length===0){showToast('所有单词都学完啦！');return;}studyQueue=unlearned.slice(0,settings.dailyNew);studyIndex=0;studyCorrect=0;studyTotal=0;switchTab('study');renderStudyCard();}
function startReviewStudy(){studyMode='review';document.getElementById('studyTitle').textContent='🔄 复习';const now=Date.now();let due=words.filter(w=>{const p=progress[w.id];return p&&p.level>0&&p.level<5&&p.nextReview<=now;});const wrongDue=words.filter(w=>wrongWords.includes(w.id)&&!due.includes(w));due=[...shuffle(due),...shuffle(wrongDue)];if(due.length===0){showToast('今天没有需要复习的单词！');return;}studyQueue=due.slice(0,settings.dailyReview);studyIndex=0;studyCorrect=0;studyTotal=0;switchTab('study');renderStudyCard();}
function renderStudyCard(){const c=document.getElementById('studyContent');if(studyIndex>=studyQueue.length){renderStudySummary();return;}const w=studyQueue[studyIndex];const pct=Math.round((studyIndex/studyQueue.length)*100);const tag=studyMode==='new'?'新词':'复习';c.innerHTML=`<div class="study-header"><span>${studyIndex+1}/${studyQueue.length}</span><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div><div class="flashcard" id="flashcard" onclick="flipCard()"><span class="fc-tag">${tag}</span><button class="fc-speak" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><div class="fc-word">${w.word}</div><div class="fc-pos">${w.pos}</div><div class="fc-meaning">${w.meaning}</div><div class="fc-hint">👆 点击卡片查看释义</div></div><div class="study-actions"><button class="study-btn btn-unknown" onclick="markWord(false)"><span class="bi">❌</span><span class="bt">不认识</span></button><button class="study-btn btn-vague" onclick="markWord('vague')"><span class="bi">😐</span><span class="bt">模糊</span></button><button class="study-btn btn-known" onclick="markWord(true)"><span class="bi">✅</span><span class="bt">认识</span></button></div>`;setTimeout(()=>speak(w.word),300);}
function flipCard(){document.getElementById('flashcard').classList.toggle('flipped');}
function markWord(known){const w=studyQueue[studyIndex];studyTotal++;if(known===true){studyCorrect++;updateProgress(w.id,true);}else if(known==='vague'){updateProgress(w.id,false);}else{updateProgress(w.id,false);studyQueue.push(w);}if(studyMode==='new')state.todayNew++;else state.todayReview++;if(studyMode==='new'&&known!==false){const idx=words.findIndex(x=>x.id===w.id);if(idx>=state.currentIndex)state.currentIndex=idx+1;}save('wb2_state',state);studyIndex++;renderStudyCard();}
function renderStudySummary(){const c=document.getElementById('studyContent');const acc=studyTotal>0?Math.round((studyCorrect/studyTotal)*100):0;const emoji=acc>=80?'🎉':acc>=60?'👍':'💪';c.innerHTML=`<div class="summary-card"><div class="emoji">${emoji}</div><h2>${studyMode==='new'?'新学':'复习'}完成！</h2><div class="score">${acc}%</div><p>正确 ${studyCorrect} / 共 ${studyTotal} 题</p><p>今日已学 ${state.todayNew} 新词 · 复习 ${state.todayReview} 词</p><div class="summary-actions"><button class="btn-secondary" onclick="switchTab('home')">返回首页</button><button class="btn-primary" onclick="${studyMode==='new'?'startReviewStudy()':'startNewStudy()'}">${studyMode==='new'?'去复习 →':'去新学 →'}</button></div></div>`;}
function quitStudy(){if(studyIndex>0&&studyIndex<studyQueue.length){if(!confirm('确定退出吗？已学的词会保存进度'))return;}switchTab('home');}
let spellQueue=[],spellIndex=0,spellCorrect=0,spellTotal=0;
function startSpell(){let pool=words.filter(w=>progress[w.id]);if(pool.length<5)pool=words;spellQueue=shuffle(pool).slice(0,15);spellIndex=0;spellCorrect=0;spellTotal=0;switchTab('spell');renderSpellCard();}
function renderSpellCard(){const c=document.getElementById('spellContent');if(spellIndex>=spellQueue.length){renderSpellSummary();return;}const w=spellQueue[spellIndex];c.innerHTML=`<div class="study-header" style="margin-bottom:14px;"><span>第 ${spellIndex+1}/${spellQueue.length} 题</span><div class="bar"><div class="bar-fill" style="width:${Math.round(spellIndex/spellQueue.length*100)}%"></div></div><span>正确 ${spellCorrect}</span></div><div class="spell-card"><div class="spell-meaning">${w.meaning}</div><div class="spell-pos">${w.pos}</div><button class="spell-speak" onclick="speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false"/><div class="spell-feedback" id="spellFeedback"></div><button class="spell-btn btn-primary" id="spellSubmit" onclick="checkSpell()">提交答案</button></div>`;const input=document.getElementById('spellInput');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')checkSpell();});setTimeout(()=>speak(w.word),400);}
function checkSpell(){const input=document.getElementById('spellInput');const feedback=document.getElementById('spellFeedback');const btn=document.getElementById('spellSubmit');const w=spellQueue[spellIndex];const answer=input.value.trim().toLowerCase();if(!answer){showToast('请输入单词');return;}spellTotal++;if(answer===w.word.toLowerCase()){spellCorrect++;input.classList.add('correct');feedback.innerHTML='<span class="fb-correct">✅ 正确！</span>';updateProgress(w.id,true);if(wrongWords.includes(w.id)){wrongWords=wrongWords.filter(id=>id!==w.id);save('wb2_wrong',wrongWords);}}else{input.classList.add('wrong');feedback.innerHTML=`<span class="fb-wrong">❌ 错误<span class="ans">正确答案：${w.word}</span></span>`;updateProgress(w.id,false);}btn.textContent='下一题 →';btn.onclick=nextSpell;input.disabled=true;}
function nextSpell(){spellIndex++;renderSpellCard();}
function renderSpellSummary(){const c=document.getElementById('spellContent');const acc=spellTotal>0?Math.round((spellCorrect/spellTotal)*100):0;c.innerHTML=`<div class="summary-card"><div class="emoji">${acc>=80?'🎉':acc>=60?'👍':'💪'}</div><h2>拼写练习完成！</h2><div class="score">${acc}%</div><p>正确 ${spellCorrect} / 共 ${spellTotal} 题</p><div class="summary-actions"><button class="btn-secondary" onclick="switchTab('home')">返回首页</button><button class="btn-primary" onclick="startSpell()">再来一轮 →</button></div></div>`;}
let quizQuestions=[],quizIndex=0,quizCorrect=0,quizWrongList=[],quizSelected=-1,quizMode='read';
function startRead(){quizMode='read';document.getElementById('quizTitle').textContent='📖 释义巩固';startQuiz();}
function startListen(){quizMode='listen';document.getElementById('quizTitle').textContent='🎧 听力训练';startQuiz();}
function startQuiz(){let pool=words.filter(w=>progress[w.id]);if(pool.length<10)pool=words;const selected=shuffle(pool).slice(0,10);quizQuestions=selected.map(w=>{const options=shuffle([w,...shuffle(words.filter(x=>x.id!==w.id)).slice(0,3)]);return{word:w,options:options,answerIndex:options.findIndex(o=>o.id===w.id)};});quizIndex=0;quizCorrect=0;quizWrongList=[];switchTab('quiz');renderQuizQuestion();}
function renderQuizQuestion(){const c=document.getElementById('quizContent');if(quizIndex>=quizQuestions.length){renderQuizResult();return;}const q=quizQuestions[quizIndex];const letters=['A','B','C','D'];quizSelected=-1;const qd=quizMode==='listen'?`<button class="spell-speak" onclick="speak('${q.word.word.replace(/'/g,"\\'")}')" style="margin-bottom:10px;">🔊</button><div style="font-size:16px;color:#95a5a6;">听发音，选择正确单词</div>`:`<div class="quiz-question">${q.word.word}</div><div class="quiz-pos">${q.word.pos}</div>`;const od=quizMode==='listen'?q.options.map((opt,i)=>`<div class="quiz-option" data-index="${i}" onclick="selectQuizOption(${i})"><span class="ol">${letters[i]}</span><span style="font-weight:600;font-size:17px;">${opt.word}</span></div>`).join(''):q.options.map((opt,i)=>`<div class="quiz-option" data-index="${i}" onclick="selectQuizOption(${i})"><span class="ol">${letters[i]}</span><span>${opt.meaning}</span></div>`).join('');c.innerHTML=`<div class="study-header" style="margin-bottom:14px;"><span>第 ${quizIndex+1}/10 题</span><div class="bar"><div class="bar-fill" style="width:${quizIndex*10}%"></div></div><span>正确 ${quizCorrect}</span></div><div class="quiz-card">${qd}<div class="quiz-options" id="quizOptions">${od}</div><div class="quiz-nav"><button class="btn-secondary" onclick="speak('${q.word.word.replace(/'/g,"\\'")}')">🔊 再听一次</button><button class="btn-primary" id="quizNextBtn" onclick="nextQuiz()" style="display:none;">下一题 →</button></div></div>`;if(quizMode==='listen')setTimeout(()=>speak(q.word.word),300);}
function selectQuizOption(index){if(quizSelected>=0)return;quizSelected=index;const q=quizQuestions[quizIndex];const options=document.querySelectorAll('.quiz-option');options.forEach((opt,i)=>{opt.classList.add('disabled');if(i===q.answerIndex)opt.classList.add('correct');if(i===index&&i!==q.answerIndex)opt.classList.add('wrong');});if(index===q.answerIndex){quizCorrect++;updateProgress(q.word.id,true);}else{quizWrongList.push(q.word);updateProgress(q.word.id,false);}document.getElementById('quizNextBtn').style.display='block';}
function nextQuiz(){quizIndex++;renderQuizQuestion();}
function renderQuizResult(){const c=document.getElementById('quizContent');const acc=Math.round((quizCorrect/10)*100);c.innerHTML=`<div class="summary-card"><div class="emoji">${acc>=80?'🏆':acc>=60?'👍':'💪'}</div><h2>${quizMode==='listen'?'听力训练':'释义巩固'}完成！</h2><div class="score">${quizCorrect}/10</div><p>正确率 ${acc}%</p>${quizWrongList.length>0?`<div style="margin-top:14px;text-align:left;max-height:180px;overflow-y:auto;"><p style="font-weight:600;margin-bottom:8px;color:#e74c3c;">错题回顾：</p>${quizWrongList.map(w=>`<div style="padding:8px 12px;background:#f8f9fb;border-radius:8px;margin-bottom:6px;font-size:13px;"><span style="font-weight:700;color:#e74c3c;">${w.word}</span><span style="color:#7f8c8d;margin-left:8px;">${w.meaning}</span></div>`).join('')}</div>`:'<p style="color:#27ae60;margin-top:10px;">全部正确，太棒了！</p>'}<div class="summary-actions" style="margin-top:16px;"><button class="btn-secondary" onclick="switchTab('home')">返回首页</button><button class="btn-primary" onclick="startQuiz()">再来一轮 →</button></div></div>`;}
let listFilter='all',listSearch='';
function renderList(){const c=document.getElementById('listContent');let list=[...words];if(listSearch){const q=listSearch.toLowerCase();list=list.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(listSearch));}if(listFilter==='high')list=list.filter(w=>w.freq>=20);else if(listFilter==='mid')list=list.filter(w=>w.freq>=10&&w.freq<20);else if(listFilter==='low')list=list.filter(w=>w.freq<10);else if(listFilter==='fav')list=list.filter(w=>favorites.includes(w.id));else if(listFilter==='wrong')list=list.filter(w=>wrongWords.includes(w.id));else if(listFilter==='learned')list=list.filter(w=>progress[w.id]);const mc=getMasteredCount();const lc=getLearnedCount()-mc;c.innerHTML=`<div class="stats-grid" style="grid-template-columns:repeat(4,1fr);"><div class="stats-card"><div class="si">📚</div><div class="snum">${words.length}</div><div class="slbl">总词数</div></div><div class="stats-card"><div class="si">✅</div><div class="snum" style="color:#27ae60;">${mc}</div><div class="slbl">已掌握</div></div><div class="stats-card"><div class="si">📖</div><div class="snum" style="color:#f39c12;">${lc}</div><div class="slbl">学习中</div></div><div class="stats-card"><div class="si">❌</div><div class="snum" style="color:#e74c3c;">${wrongWords.length}</div><div class="slbl">错词</div></div></div><div class="list-search"><input type="text" placeholder="搜索单词或释义..." value="${listSearch}" oninput="listSearch=this.value;renderList()"/></div><div class="list-filters"><button class="list-filter ${listFilter==='all'?'active':''}" onclick="setListFilter('all')">全部</button><button class="list-filter ${listFilter==='high'?'active':''}" onclick="setListFilter('high')">高频</button><button class="list-filter ${listFilter==='mid'?'active':''}" onclick="setListFilter('mid')">中频</button><button class="list-filter ${listFilter==='low'?'active':''}" onclick="setListFilter('low')">低频</button><button class="list-filter ${listFilter==='learned'?'active':''}" onclick="setListFilter('learned')">已学</button><button class="list-filter ${listFilter==='fav'?'active':''}" onclick="setListFilter('fav')">⭐收藏</button><button class="list-filter ${listFilter==='wrong'?'active':''}" onclick="setListFilter('wrong')">❌错词</button></div>${list.length===0?'<div style="text-align:center;padding:40px;color:#bdc3c7;">没有找到匹配的单词</div>':list.map(w=>{const fc=w.freq>=20?'high':w.freq>=10?'mid':'low';const isFav=favorites.includes(w.id);const isL=!!progress[w.id];return `<div class="word-item ${fc} ${isL?'learned':''}"><div class="wi-num">${w.id}</div><div class="wi-main" onclick="speak('${w.word.replace(/'/g,"\\'")}')"><div class="wi-word">${w.word}</div><div class="wi-meaning">${w.pos} ${w.meaning}</div></div><div class="wi-actions"><button class="wi-btn spk" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><button class="wi-btn fav ${isFav?'active':''}" onclick="toggleFav(${w.id})">${isFav?'⭐':'☆'}</button></div></div>`;}).join('')}`;}
function setListFilter(f){listFilter=f;renderList();}
function toggleFav(id){const i=favorites.indexOf(id);if(i>-1)favorites.splice(i,1);else favorites.push(id);save('wb2_fav',favorites);renderList();}
function renderStats(){const c=document.getElementById('statsContent');const mc=getMasteredCount();const lc=getLearnedCount()-mc;const nc=words.length-mc-lc;c.innerHTML=`<div class="stats-hero"><div class="sf">🔥</div><div class="sn">${stats.streak}</div><div class="sl">连续学习天数</div></div><div class="stats-grid"><div class="stats-card"><div class="si">📖</div><div class="snum">${state.todayNew+state.todayReview}</div><div class="slbl">今日学习</div></div><div class="stats-card"><div class="si">🎯</div><div class="snum">${getLearnedCount()}</div><div class="slbl">累计已学</div></div><div class="stats-card"><div class="si">✅</div><div class="snum">${mc}</div><div class="slbl">已掌握</div></div><div class="stats-card"><div class="si">❌</div><div class="snum">${wrongWords.length}</div><div class="slbl">错词本</div></div></div><div class="stats-prog"><h3>📊 学习进度</h3><div class="prog-row"><div class="prl"><span>已掌握</span><span>${mc}词 (${Math.round(mc/words.length*100)}%)</span></div><div class="prb"><div class="prf pf-mastered" style="width:${mc/words.length*100}%"></div></div></div><div class="prog-row"><div class="prl"><span>学习中</span><span>${lc}词 (${Math.round(lc/words.length*100)}%)</span></div><div class="prb"><div class="prf pf-learning" style="width:${lc/words.length*100}%"></div></div></div><div class="prog-row"><div class="prl"><span>未学习</span><span>${nc}词 (${Math.round(nc/words.length*100)}%)</span></div><div class="prb"><div class="prf pf-new" style="width:${nc/words.length*100}%"></div></div></div></div><div class="stats-prog"><h3>📝 今日计划</h3><div class="prog-row"><div class="prl"><span>新学</span><span>${state.todayNew}/${settings.dailyNew}</span></div><div class="prb"><div class="prf pf-learning" style="width:${Math.min(100,state.todayNew/settings.dailyNew*100)}%"></div></div></div><div class="prog-row"><div class="prl"><span>复习</span><span>${state.todayReview}/${settings.dailyReview}</span></div><div class="prb"><div class="prf pf-mastered" style="width:${Math.min(100,state.todayReview/settings.dailyReview*100)}%"></div></div></div></div>`;}
function renderMe(){const badge=document.getElementById('meWrongBadge');if(wrongWords.length>0){badge.style.display='inline-block';badge.textContent=wrongWords.length;}else badge.style.display='none';}
function openSettings(){const newNums=[5,10,15,20,30,50];const reviewNums=[10,20,30,40,50,100];document.getElementById('newNumPicker').innerHTML=newNums.map(n=>`<div class="num-opt ${settings.dailyNew===n?'active':''}" onclick="setDailyNew(${n})">${n}词/天</div>`).join('');document.getElementById('reviewNumPicker').innerHTML=reviewNums.map(n=>`<div class="num-opt ${settings.dailyReview===n?'active':''}" onclick="setDailyReview(${n})">${n}词/天</div>`).join('');document.querySelectorAll('#accentPicker .num-opt').forEach(el=>{el.classList.toggle('active',el.dataset.accent===settings.accent);});document.getElementById('settingsModal').classList.add('show');}
function closeSettings(){document.getElementById('settingsModal').classList.remove('show');renderHome();}
function setDailyNew(n){settings.dailyNew=n;save('wb2_settings',settings);openSettings();showToast('每日新学设为'+n+'词');}
function setDailyReview(n){settings.dailyReview=n;save('wb2_settings',settings);openSettings();showToast('每日复习设为'+n+'词');}
function setAccent(a){settings.accent=a;save('wb2_settings',settings);openSettings();showToast(a==='us'?'已切换为美式发音':'已切换为英式发音');}
function openWrongModal(){document.getElementById('wrongCount').textContent=wrongWords.length;const body=document.getElementById('wrongModalBody');if(wrongWords.length===0){body.innerHTML='<div class="modal-empty"><div class="icon">🎉</div><p>错词本为空，继续保持！</p></div>';}else{body.innerHTML=wrongWords.map(id=>{const w=wordMap[id];if(!w)return'';return `<div class="word-item" style="margin-bottom:8px;"><div class="wi-main" onclick="speak('${w.word.replace(/'/g,"\\'")}')"><div class="wi-word">${w.word}</div><div class="wi-meaning">${w.pos} ${w.meaning}</div></div><div class="wi-actions"><button class="wi-btn spk" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><button class="wi-btn" onclick="removeWrong(${w.id})">✕</button></div></div>`;}).join('');}document.getElementById('wrongModal').classList.add('show');}
function closeWrongModal(){document.getElementById('wrongModal').classList.remove('show');}
function removeWrong(id){wrongWords=wrongWords.filter(wid=>wid!==id);save('wb2_wrong',wrongWords);openWrongModal();showToast('已从错词本移除');}
function resetAll(){if(!confirm('确定要重置所有学习进度吗？\n已学记录、错词本、连续打卡都会清空！'))return;progress={};state={currentIndex:0,todayNew:0,todayReview:0,lastDate:todayStr()};wrongWords=[];stats={streak:0,totalReviews:0,lastStudyDate:null};save('wb2_progress',progress);save('wb2_state',state);save('wb2_wrong',wrongWords);save('wb2_stats',stats);renderHome();showToast('进度已重置，重新开始吧！');}
document.getElementById('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings();});
document.getElementById('wrongModal').addEventListener('click',e=>{if(e.target.id==='wrongModal')closeWrongModal();});
renderHome();
</script>
