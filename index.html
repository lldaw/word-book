.flashcard .fc-pos{font-size:15px;color:#95a5a6;margin-top:8px;font-style:italic;}

.study-btn{flex:1;padding:14px 0;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}

.btn-unknown{background:#fef0ef;color:#e74c3c;}
.btn-vague{background:#fff8e1;color:#f39c12;}

.btn-primary{background:#e74c3c;color:#fff;}
.btn-secondary{background:#f0f3f7;color:#5a6c7d;}

.spell-card .spell-speak:active{background:#d4e9fc;}
.spell-input{width:100%;padding:14px 18px;border:2px solid #e0e6ed;border-radius:14px;font-size:18px;text-align:center;letter-spacing:2px;outline:none;transition:border-color .3s;font-weight:600;color:#2c3e50;}
.spell-input:focus{border-color:#e74c3c;}
.spell-input.correct{border-color:#27ae60;background:#f0faf4;color:#27ae60;}
.spell-input.wrong{border-color:#e74c3c;background:#fef5f5;color:#e74c3c;}

.spell-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:all .2s;}

.setup-option .opt-icon{font-size:20px;}
.setup-option .opt-text{flex:1;}
.setup-option .opt-desc{font-size:11px;color:#95a5a6;display:block;margin-top:2px;}
.quiz-container{max-width:480px;margin:0 auto;padding:20px 16px;}

.quiz-option.wrong{border-color:#e74c3c;background:#fef5f5;}

.quiz-nav{display:flex;gap:10px;margin-top:18px;}

.list-container{max-width:600px;margin:0 auto;padding:14px 12px;}
.list-search{position:relative;margin-bottom:10px;}

.list-search input:focus{border-color:#e74c3c;}

.list-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}

.list-filter.active{background:#e74c3c;color:#fff;border-color:#e74c3c;}
.word-item{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.04);border-left:3px solid #e0e6ed;transition:transform .15s;}

.word-item.high{border-left-color:#e74c3c;}
.word-item.mid{border-left-color:#f39c12;}
.word-item.low{border-left-color:#3498db;}

.wi-num{font-size:11px;color:#bdc3c7;font-weight:600;min-width:28px;text-align:center;}
.wi-main{flex:1;cursor:pointer;min-width:0;}

function loadData(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function saveData(k,v){localStorage.setItem(k,JSON.stringify(v))}
let progress=loadData('wb_progress',{});
let wrongWords=loadData('wb_wrong',[]);
let favorites=loadData('wb_fav',[]);
let stats=loadData('wb_stats',{totalLearned:0,todayLearned:0,todayCorrect:0,todayTotal:0,streak:0,lastStudyDate:null,totalReviews:0});
function todayStr(){return new Date().toISOString().slice(0,10)}
function checkDailyReset(){const t=todayStr();if(stats.lastStudyDate!==t){if(stats.lastStudyDate){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);if(stats.lastStudyDate===y&&stats.todayLearned>0)stats.streak++;else if(stats.lastStudyDate!==y)stats.streak=0;}stats.todayLearned=0;stats.todayCorrect=0;stats.todayTotal=0;stats.lastStudyDate=t;saveData('wb_stats',stats);}}
checkDailyReset();
function recordStudy(c){stats.todayTotal++;if(c)stats.todayCorrect++;stats.totalReviews++;saveData('wb_stats',stats);}
const REVIEW_INTERVALS=[0,1,2,4,7,15];
function updateProgress(id,known){const p=progress[id]||{level:0,nextReview:0,reviews:0};p.reviews++;if(known)p.level=Math.min(p.level+1,5);else{p.level=0;if(!wrongWords.includes(id)){wrongWords.push(id);saveData('wb_wrong',wrongWords);}}p.nextReview=Date.now()+REVIEW_INTERVALS[p.level]*86400000;progress[id]=p;saveData('wb_progress',progress);stats.totalLearned=Object.keys(progress).length;saveData('wb_stats',stats);}
function getWordLevel(id){const p=progress[id];if(!p)return'new';if(p.level>=5)return'mastered';return'review';}
let audioPlayer=null;
function speak(text){if(audioPlayer){audioPlayer.pause();audioPlayer=null;}const word=encodeURIComponent(text.trim());const url='https://dict.youdao.com/dictvoice?audio='+word+'&type=2';try{audioPlayer=new Audio(url);audioPlayer.play().catch(()=>fallbackSpeak(text));audioPlayer.onerror=()=>fallbackSpeak(text);}catch(e){fallbackSpeak(text);}}
function fallbackSpeak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;window.speechSynthesis.speak(u);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
document.querySelectorAll('.tab-item').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('page-'+tab.dataset.page).classList.add('active');if(tab.dataset.page==='list')renderList();if(tab.dataset.page==='stats')renderStats();if(tab.dataset.page==='spell')renderSpellSetup();if(tab.dataset.page==='quiz')renderQuizSetup();});});
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let studyQueue=[],studyIndex=0,studySessionCorrect=0,studySessionTotal=0;
function buildStudyQueue(){const now=Date.now();const dueReview=words.filter(w=>{const p=progress[w.id];return p&&p.level>0&&p.level<5&&p.nextReview<=now;});const newWords=words.filter(w=>!progress[w.id]);const wrong=words.filter(w=>wrongWords.includes(w.id)&&!dueReview.includes(w));let queue=[...shuffle(dueReview),...shuffle(newWords).slice(0,15),...shuffle(wrong).slice(0,5)];if(queue.length<10)queue=shuffle([...words]).slice(0,20);return queue.slice(0,30);}
function startStudy(){studyQueue=buildStudyQueue();studyIndex=0;studySessionCorrect=0;studySessionTotal=0;renderStudyCard();}
function renderStudyCard(){const c=document.getElementById('studyContent');if(studyIndex>=studyQueue.length){renderStudySummary();return;}const w=studyQueue[studyIndex];const level=getWordLevel(w.id);const levelText=level==='new'?'新词':level==='mastered'?'已掌握':'复习';const pct=Math.round((studyIndex/studyQueue.length)*100);c.innerHTML=`<div class="study-progress"><span>${studyIndex+1} / ${studyQueue.length}</span><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div><div class="flashcard" id="flashcard" onclick="flipCard()"><span class="fc-level level-${level}">${levelText}</span><button class="fc-speak" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><div class="fc-word">${w.word}</div><div class="fc-pos">${w.pos}</div><div class="fc-meaning">${w.meaning}</div><div class="fc-hint">👆 点击卡片查看释义</div></div><div class="study-actions"><button class="study-btn btn-unknown" onclick="markWord(false)"><span class="btn-icon">❌</span><span class="btn-text">不认识</span></button><button class="study-btn btn-vague" onclick="markWord('vague')"><span class="btn-icon">😐</span><span class="btn-text">模糊</span></button><button class="study-btn btn-known" onclick="markWord(true)"><span class="btn-icon">✅</span><span class="btn-text">认识</span></button></div>`;setTimeout(()=>speak(w.word),300);}
function flipCard(){document.getElementById('flashcard').classList.toggle('flipped');}
function markWord(known){const w=studyQueue[studyIndex];studySessionTotal++;stats.todayLearned++;if(known===true){studySessionCorrect++;updateProgress(w.id,true);recordStudy(true);}else if(known==='vague'){updateProgress(w.id,false);recordStudy(false);}else{updateProgress(w.id,false);recordStudy(false);studyQueue.push(w);}saveData('wb_stats',stats);studyIndex++;renderStudyCard();}
function renderStudySummary(){const c=document.getElementById('studyContent');const acc=studySessionTotal>0?Math.round((studySessionCorrect/studySessionTotal)*100):0;const emoji=acc>=80?'🎉':acc>=60?'👍':'💪';c.innerHTML=`<div class="study-summary"><div class="emoji">${emoji}</div><h2>本轮学习完成！</h2><div class="score">${acc}%</div><p>正确 ${studySessionCorrect} / 共 ${studySessionTotal} 题</p><p>今日已学 ${stats.todayLearned} 词</p><div class="summary-actions"><button class="btn-secondary" onclick="startStudy()">🔄 再来一轮</button><button class="btn-primary" onclick="switchTab('spell')">✍️ 去拼写</button></div></div>`;}
function switchTab(p){document.querySelector(`.tab-item[data-page="${p}"]`).click();}
startStudy();
let spellQueue=[],spellIndex=0,spellCorrect=0,spellTotal=0,spellMode='all';
function renderSpellSetup(){const c=document.getElementById('spellContent');const wc=wrongWords.length;c.innerHTML=`<div class="spell-setup"><h2>选择练习范围</h2><div class="setup-options"><div class="setup-option active" data-mode="all" onclick="selectSpellMode(this)"><span class="opt-icon">📚</span><span class="opt-text">全部单词<span class="opt-desc">从498词中随机抽取</span></span></div><div class="setup-option" data-mode="wrong" onclick="selectSpellMode(this)"><span class="opt-icon">❌</span><span class="opt-text">错词本<span class="opt-desc">${wc>0?'共'+wc+'个错词':'暂无错词'}</span></span></div><div class="setup-option" data-mode="high" onclick="selectSpellMode(this)"><span class="opt-icon">🔥</span><span class="opt-text">高频词<span class="opt-desc">频次≥20的核心词</span></span></div></div><button class="spell-btn btn-primary" onclick="startSpell()">开始拼写练习 →</button></div>`;}
function selectSpellMode(el){document.querySelectorAll('.setup-option').forEach(o=>o.classList.remove('active'));el.classList.add('active');spellMode=el.dataset.mode;}
function startSpell(){let pool=words;if(spellMode==='wrong'){pool=words.filter(w=>wrongWords.includes(w.id));if(pool.length===0){showToast('错词本为空，先去学习吧！');return;}}else if(spellMode==='high')pool=words.filter(w=>w.freq>=20);spellQueue=shuffle(pool).slice(0,15);spellIndex=0;spellCorrect=0;spellTotal=0;renderSpellCard();}
function renderSpellCard(){const c=document.getElementById('spellContent');if(spellIndex>=spellQueue.length){renderSpellSummary();return;}const w=spellQueue[spellIndex];c.innerHTML=`<div class="spell-progress">第 ${spellIndex+1} / ${spellQueue.length} 题 · 正确 ${spellCorrect}</div><div class="spell-card"><div class="spell-meaning">${w.meaning}</div><div class="spell-pos">${w.pos}</div><button class="spell-speak" onclick="speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false"/><div class="spell-feedback" id="spellFeedback"></div><button class="spell-btn btn-primary" id="spellSubmit" onclick="checkSpell()">提交答案</button></div>`;const input=document.getElementById('spellInput');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')checkSpell();});setTimeout(()=>speak(w.word),400);}
function checkSpell(){const input=document.getElementById('spellInput');const feedback=document.getElementById('spellFeedback');const btn=document.getElementById('spellSubmit');const w=spellQueue[spellIndex];const answer=input.value.trim().toLowerCase();const correct=w.word.toLowerCase();if(!answer){showToast('请输入单词');return;}spellTotal++;recordStudy(answer===correct);stats.todayLearned++;if(answer===correct){spellCorrect++;input.classList.add('correct');feedback.innerHTML='<span class="feedback-correct">✅ 正确！</span>';updateProgress(w.id,true);if(wrongWords.includes(w.id)){wrongWords=wrongWords.filter(id=>id!==w.id);saveData('wb_wrong',wrongWords);}}else{input.classList.add('wrong');feedback.innerHTML=`<span class="feedback-wrong">❌ 错误<span class="answer">正确答案：${w.word}</span></span>`;updateProgress(w.id,false);}saveData('wb_stats',stats);btn.textContent='下一题 →';btn.onclick=nextSpell;input.disabled=true;}
function nextSpell(){spellIndex++;renderSpellCard();}
function renderSpellSummary(){const c=document.getElementById('spellContent');const acc=spellTotal>0?Math.round((spellCorrect/spellTotal)*100):0;c.innerHTML=`<div class="study-summary"><div class="emoji">${acc>=80?'🎉':acc>=60?'👍':'💪'}</div><h2>拼写练习完成！</h2><div class="score">${acc}%</div><p>正确 ${spellCorrect} / 共 ${spellTotal} 题</p><div class="summary-actions"><button class="btn-secondary" onclick="renderSpellSetup()">🔄 重新选择</button><button class="btn-primary" onclick="startSpell()">再来一轮 →</button></div></div>`;}
let quizQuestions=[],quizIndex=0,quizCorrect=0,quizWrongList=[],quizSelected=-1;
function renderQuizSetup(){const c=document.getElementById('quizContent');c.innerHTML=`<div class="spell-setup"><h2>选择题测验</h2><p style="color:#7f8c8d;font-size:14px;margin-bottom:20px;">10题一组，看单词选释义</p><button class="spell-btn btn-primary" onclick="startQuiz()">开始测验 →</button></div>`;}
function startQuiz(){const selected=shuffle(words).slice(0,10);quizQuestions=selected.map(w=>{const options=shuffle([w,...shuffle(words.filter(x=>x.id!==w.id)).slice(0,3)]);return{word:w,options:options,answerIndex:options.findIndex(o=>o.id===w.id)};});quizIndex=0;quizCorrect=0;quizWrongList=[];renderQuizQuestion();}
function renderQuizQuestion(){const c=document.getElementById('quizContent');if(quizIndex>=quizQuestions.length){renderQuizResult();return;}const q=quizQuestions[quizIndex];const letters=['A','B','C','D'];quizSelected=-1;c.innerHTML=`<div class="spell-progress">第 ${quizIndex+1} / 10 题</div><div class="quiz-card"><div class="quiz-question">${q.word.word}</div><div class="quiz-pos">${q.word.pos}</div><div class="quiz-options" id="quizOptions">${q.options.map((opt,i)=>`<div class="quiz-option" data-index="${i}" onclick="selectQuizOption(${i})"><span class="opt-letter">${letters[i]}</span><span>${opt.meaning}</span></div>`).join('')}</div><div class="quiz-nav"><button class="btn-secondary" onclick="speak('${q.word.word.replace(/'/g,"\\'")}')">🔊 发音</button><button class="btn-primary" id="quizNextBtn" onclick="nextQuiz()" style="display:none;">下一题 →</button></div></div>`;setTimeout(()=>speak(q.word.word),300);}
function selectQuizOption(index){if(quizSelected>=0)return;quizSelected=index;const q=quizQuestions[quizIndex];const options=document.querySelectorAll('.quiz-option');options.forEach((opt,i)=>{opt.classList.add('disabled');if(i===q.answerIndex)opt.classList.add('correct');if(i===index&&i!==q.answerIndex)opt.classList.add('wrong');});recordStudy(index===q.answerIndex);stats.todayLearned++;saveData('wb_stats',stats);if(index===q.answerIndex){quizCorrect++;updateProgress(q.word.id,true);}else{quizWrongList.push(q.word);updateProgress(q.word.id,false);}document.getElementById('quizNextBtn').style.display='block';}
function nextQuiz(){quizIndex++;renderQuizQuestion();}
function renderQuizResult(){const c=document.getElementById('quizContent');const acc=Math.round((quizCorrect/10)*100);c.innerHTML=`<div class="quiz-result"><div class="emoji">${acc>=80?'🏆':acc>=60?'👍':'💪'}</div><h2>测验完成！</h2><div class="big-score">${quizCorrect}/10</div><p>正确率 ${acc}%</p>${quizWrongList.length>0?`<div class="quiz-wrong-list"><p style="font-weight:600;margin-bottom:8px;color:#e74c3c;">错题回顾：</p>${quizWrongList.map(w=>`<div class="quiz-wrong-item"><span class="w-word">${w.word}</span><span class="w-meaning">${w.meaning}</span></div>`).join('')}</div>`:'<p style="color:#27ae60;margin-top:10px;">全部正确，太棒了！</p>'}<div class="summary-actions" style="margin-top:20px;"><button class="btn-secondary" onclick="renderQuizSetup()">🔄 重新测验</button><button class="btn-primary" onclick="switchTab('study')">📚 去学习</button></div></div>`;}
let listFilter='all',listSearch='';
function renderList(){const c=document.getElementById('listContent');let list=[...words];if(listSearch){const q=listSearch.toLowerCase();list=list.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(listSearch));}if(listFilter==='high')list=list.filter(w=>w.freq>=20);else if(listFilter==='mid')list=list.filter(w=>w.freq>=10&&w.freq<20);else if(listFilter==='low')list=list.filter(w=>w.freq<10);else if(listFilter==='fav')list=list.filter(w=>favorites.includes(w.id));else if(listFilter==='wrong')list=list.filter(w=>wrongWords.includes(w.id));else if(listFilter==='mastered')list=list.filter(w=>getWordLevel(w.id)==='mastered');const mc=words.filter(w=>getWordLevel(w.id)==='mastered').length;const lc=words.filter(w=>getWordLevel(w.id)==='review').length;c.innerHTML=`<div class="list-stats"><div class="list-stat"><div class="num">${words.length}</div><div class="lbl">总词数</div></div><div class="list-stat"><div class="num" style="color:#27ae60;">${mc}</div><div class="lbl">已掌握</div></div><div class="list-stat"><div class="num" style="color:#f39c12;">${lc}</div><div class="lbl">学习中</div></div><div class="list-stat"><div class="num" style="color:#e74c3c;">${wrongWords.length}</div><div class="lbl">错词</div></div></div><div class="list-search"><input type="text" placeholder="搜索单词或释义..." value="${listSearch}" oninput="listSearch=this.value;renderList()"/></div><div class="list-filters"><button class="list-filter ${listFilter==='all'?'active':''}" onclick="setListFilter('all')">全部</button><button class="list-filter ${listFilter==='high'?'active':''}" onclick="setListFilter('high')">高频</button><button class="list-filter ${listFilter==='mid'?'active':''}" onclick="setListFilter('mid')">中频</button><button class="list-filter ${listFilter==='low'?'active':''}" onclick="setListFilter('low')">低频</button><button class="list-filter ${listFilter==='fav'?'active':''}" onclick="setListFilter('fav')">⭐收藏</button><button class="list-filter ${listFilter==='wrong'?'active':''}" onclick="setListFilter('wrong')">❌错词</button><button class="list-filter ${listFilter==='mastered'?'active':''}" onclick="setListFilter('mastered')">✅已掌握</button></div>${list.length===0?'<div style="text-align:center;padding:40px;color:#bdc3c7;">没有找到匹配的单词</div>':list.map(w=>{const fc=w.freq>=20?'high':w.freq>=10?'mid':'low';const isFav=favorites.includes(w.id);const isM=getWordLevel(w.id)==='mastered';return `<div class="word-item ${fc} ${isM?'mastered-item':''}"><div class="wi-num">${w.id}</div><div class="wi-main" onclick="speak('${w.word.replace(/'/g,"\\'")}')"><div class="wi-word">${w.word}</div><div class="wi-meaning">${w.pos} ${w.meaning}</div></div><div class="wi-actions"><button class="wi-btn speak" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')" title="发音">🔊</button><button class="wi-btn fav ${isFav?'active':''}" onclick="toggleFav(${w.id})" title="收藏">${isFav?'⭐':'☆'}</button></div></div>`;}).join('')}`;}
function setListFilter(f){listFilter=f;renderList();}
function toggleFav(id){const i=favorites.indexOf(id);if(i>-1)favorites.splice(i,1);else favorites.push(id);saveData('wb_fav',favorites);renderList();}
function renderStats(){const c=document.getElementById('statsContent');const mc=words.filter(w=>getWordLevel(w.id)==='mastered').length;const lc=words.filter(w=>getWordLevel(w.id)==='review').length;const nc=words.length-mc-lc;const acc=stats.todayTotal>0?Math.round((stats.todayCorrect/stats.todayTotal)*100):0;c.innerHTML=`<div class="stats-hero"><div class="streak-fire">🔥</div><div class="streak-num">${stats.streak}</div><div class="streak-label">连续学习天数</div></div><div class="stats-grid"><div class="stats-card"><div class="sc-icon">📖</div><div class="sc-num">${stats.todayLearned}</div><div class="sc-label">今日学习</div></div><div class="stats-card"><div class="sc-icon">🎯</div><div class="sc-num">${acc}%</div><div class="sc-label">今日正确率</div></div><div class="stats-card"><div class="sc-icon">✅</div><div class="sc-num">${mc}</div><div class="sc-label">已掌握</div></div><div class="stats-card"><div class="sc-icon">❌</div><div class="sc-num">${wrongWords.length}</div><div class="sc-label">错词本</div></div></div><div class="stats-progress-section"><h3>📊 学习进度</h3><div class="progress-row"><div class="pr-label"><span>已掌握</span><span>${mc}词 (${Math.round(mc/words.length*100)}%)</span></div><div class="pr-bar"><div class="pr-fill fill-mastered" style="width:${mc/words.length*100}%"></div></div></div><div class="progress-row"><div class="pr-label"><span>学习中</span><span>${lc}词 (${Math.round(lc/words.length*100)}%)</span></div><div class="pr-bar"><div class="pr-fill fill-learning" style="width:${lc/words.length*100}%"></div></div></div><div class="progress-row"><div class="pr-label"><span>未学习</span><span>${nc}词 (${Math.round(nc/words.length*100)}%)</span></div><div class="pr-bar"><div class="pr-fill fill-new" style="width:${nc/words.length*100}%"></div></div></div></div><div class="stats-actions"><button class="btn-secondary" onclick="openWrongModal()">📋 查看错词本</button><button class="btn-danger" onclick="resetAllProgress()">🔄 重置进度</button></div>`;}
function openWrongModal(){document.getElementById('wrongCount').textContent=wrongWords.length;const body=document.getElementById('wrongModalBody');if(wrongWords.length===0){body.innerHTML='<div class="modal-empty"><div class="icon">🎉</div><p>错词本为空，继续保持！</p></div>';}else{body.innerHTML=wrongWords.map(id=>{const w=wordMap[id];if(!w)return'';return `<div class="word-item" style="margin-bottom:8px;"><div class="wi-main" onclick="speak('${w.word.replace(/'/g,"\\'")}')"><div class="wi-word">${w.word}</div><div class="wi-meaning">${w.pos} ${w.meaning}</div></div><div class="wi-actions"><button class="wi-btn speak" onclick="event.stopPropagation();speak('${w.word.replace(/'/g,"\\'")}')">🔊</button><button class="wi-btn" onclick="removeWrong(${w.id})" title="移除">✕</button></div></div>`;}).join('');}document.getElementById('wrongModal').classList.add('show');}
function closeWrongModal(){document.getElementById('wrongModal').classList.remove('show');}
function removeWrong(id){wrongWords=wrongWords.filter(wid=>wid!==id);saveData('wb_wrong',wrongWords);openWrongModal();showToast('已从错词本移除');}
function resetAllProgress(){if(!confirm('确定要重置所有学习进度吗？此操作不可恢复！'))return;progress={};wrongWords=[];stats={totalLearned:0,todayLearned:0,todayCorrect:0,todayTotal:0,streak:0,lastStudyDate:todayStr(),totalReviews:0};saveData('wb_progress',progress);saveData('wb_wrong',wrongWords);saveData('wb_stats',stats);renderStats();startStudy();showToast('进度已重置');}
document.getElementById('wrongModal').addEventListener('click',e=>{if(e.target.id==='wrongModal')closeWrongModal();});
</script>
</body>
</html>
